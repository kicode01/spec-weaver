<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <style>
    .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect width="860" height="440" rx="16" fill="url(#bg1)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="44" class="headline">Why Standard Unit Tests Fail (The Double-Spend Glitch)</text>
  <text x="40" y="64" class="subtext">Spec Weaver tests 200,000 cosmic timing sequences upfront to mathematically prevent race conditions.</text>

  <!-- Phone A Box -->
  <g transform="translate(40, 95)">
    <rect width="230" height="130" rx="10" fill="#131c2e" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="14" y="14" width="75" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#60a5fa">PHONE 1 (ALICE)</text>
    <text x="14" y="62" class="mono" fill="#cbd5e1">1. Taps "Withdraw $80"</text>
    <text x="14" y="85" class="mono" fill="#60a5fa">Reads balance: $100 (OK)</text>
    <text x="14" y="108" class="mono" fill="#93c5fd">Deducts $80 -&gt; New: $20</text>
  </g>

  <!-- Phone B Box -->
  <g transform="translate(40, 245)">
    <rect width="230" height="130" rx="10" fill="#261419" stroke="#b91c1c" stroke-width="1.5"/>
    <rect x="14" y="14" width="75" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="22" y="28" class="badge" fill="#f87171">PHONE 2 (BOB)</text>
    <text x="14" y="62" class="mono" fill="#cbd5e1">1. Taps "Withdraw $80"</text>
    <text x="14" y="85" class="mono" fill="#f87171">Reads balance: $100 (OK!)</text>
    <text x="14" y="108" class="mono" fill="#fca5a5">Deducts $80 -&gt; New: -$60</text>
  </g>

  <!-- Middle Timeline Axis -->
  <g transform="translate(300, 95)">
    <rect width="210" height="280" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="32" class="badge" fill="#94a3b8">SPLIT-SECOND TIMELINE</text>

    <!-- Ticks -->
    <circle cx="28" cy="70" r="4" fill="#38bdf8"/>
    <text x="42" y="74" class="mono" fill="#cbd5e1">0.00ms: Phone 1 reads $100</text>

    <circle cx="28" cy="120" r="4" fill="#f87171"/>
    <text x="42" y="124" class="mono" fill="#fca5a5">0.02ms: Phone 2 reads $100</text>

    <circle cx="28" cy="170" r="4" fill="#38bdf8"/>
    <text x="42" y="174" class="mono" fill="#cbd5e1">0.04ms: Phone 1 takes $80</text>

    <circle cx="28" cy="220" r="4" fill="#ef4444"/>
    <text x="42" y="224" class="mono" fill="#ef4444">0.06ms: Phone 2 takes $80</text>

    <line x1="20" y1="245" x2="190" y2="245" stroke="#1e293b"/>
    <text x="20" y="265" class="mono" fill="#ef4444">Account lost: $60 (BUG)</text>
  </g>

  <!-- Spec Weaver Solution Box -->
  <g transform="translate(540, 95)">
    <rect width="280" height="280" rx="12" fill="#061c16" stroke="#059669" stroke-width="2"/>
    <rect x="16" y="16" width="120" height="22" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="24" y="31" class="badge" fill="#34d399">SPEC WEAVER PROVER</text>

    <text x="16" y="72" class="headline" font-size="14" fill="#34d399">Mathematical Proof</text>
    <text x="16" y="94" class="subtext">Simulates every thread order before you write application code.</text>

    <rect x="16" y="115" width="248" height="55" rx="6" fill="#042f24"/>
    <text x="26" y="138" class="badge" fill="#6ee7b7">INVARIANT PROVEN</text>
    <text x="26" y="156" class="mono" fill="#a7f3d0">[](balance &gt;= 0) Guaranteed</text>

    <rect x="16" y="185" width="248" height="75" rx="6" fill="#0b1714"/>
    <text x="24" y="208" class="mono" fill="#6ee7b7">[+] Generates Atomic Lock</text>
    <text x="24" y="228" class="mono" fill="#6ee7b7">[+] Zero Double-Spend Risk</text>
    <text x="24" y="248" class="mono" fill="#6ee7b7">[+] Emits Clean Go/Rust Code</text>
  </g>

  <!-- Bottom Summary Strip -->
  <rect x="40" y="390" width="780" height="34" rx="6" fill="#030712" stroke="#1f2937"/>
  <circle cx="58" cy="407" r="4" fill="#10b981"/>
  <text x="74" y="411" class="mono" fill="#94a3b8">Result: What unit tests miss in 1-in-a-billion timings, Spec Weaver proves in 0.03 seconds.</text>
</svg>
